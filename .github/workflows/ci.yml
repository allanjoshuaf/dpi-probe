name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m coverage run --source=src -m pytest -q
      - name: Report coverage
        # Active network probes require controlled endpoints and are exercised
        # during field sessions, not from a shared GitHub runner.
        run: python -m coverage report --omit="src/probes/*" --fail-under=40
      - name: Compile sources
        run: python -m compileall -q main.py src
